name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build Tokify.app (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cmd/tock-desktop/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Stamp version from tag into wails.json
        # The tag is like "v0.1.0"; Wails wants a bare version string in the
        # productVersion field, which gets baked into Info.plist.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building Tokify ${VERSION}"
          # macOS sed needs an empty backup arg; -i '' is portable on darwin.
          sed -i '' -E "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${VERSION}\"/" cmd/tock-desktop/wails.json
          grep productVersion cmd/tock-desktop/wails.json

      - name: Build universal .app
        working-directory: cmd/tock-desktop
        env:
          NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
          NEON_DATA_URL: ${{ secrets.NEON_DATA_URL }}
        # Bake the Neon endpoints into the binary the same way
        # `make desktop-build-universal` does via -ldflags. CI builds wails
        # directly (not through the Makefile), so inject them here or the
        # released .app ships with empty DefaultAuthURL/DefaultDataURL and
        # Neon auth + sync are dead.
        run: |
          wails build -clean -platform darwin/universal \
            -ldflags "-X main.version=${GITHUB_REF_NAME#v} -X github.com/kriuchkov/tock/internal/integrations/neonauth.DefaultAuthURL=${NEON_AUTH_URL} -X github.com/kriuchkov/tock/internal/integrations/neonsync.DefaultDataURL=${NEON_DATA_URL}"

      - name: Rename bundle to Tokify.app
        run: |
          cd cmd/tock-desktop/build/bin
          if [ -d tock-desktop.app ]; then
            rm -rf Tokify.app
            mv tock-desktop.app Tokify.app
          fi
          ls -la

      - name: Install license-gathering tools
        run: |
          go install github.com/google/go-licenses@latest
          npm install -g license-checker-rseidelsohn
          # jq is preinstalled on macos-latest runners.

      - name: Generate THIRD_PARTY_NOTICES.txt
        run: ./scripts/gen-notices.sh "$PWD/THIRD_PARTY_NOTICES.txt"

      - name: Bundle license texts into Tokify.app
        run: |
          RES="cmd/tock-desktop/build/bin/Tokify.app/Contents/Resources"
          mkdir -p "$RES"
          cp LICENSE "$RES/LICENSE"
          cp THIRD_PARTY_NOTICES.txt "$RES/THIRD_PARTY_NOTICES.txt"
          # Nunito is bundled with the frontend; ship its OFL alongside.
          cp cmd/tock-desktop/frontend/src/assets/fonts/OFL.txt "$RES/Nunito-OFL.txt"

      - name: Zip Tokify.app
        run: |
          mkdir -p dist
          cp THIRD_PARTY_NOTICES.txt dist/
          ASSET="Tokify-${GITHUB_REF_NAME}-macos-universal.zip"
          # `ditto` preserves macOS bundle attributes (resource forks,
          # extended attrs) better than plain `zip`.
          ditto -c -k --sequesterRsrc --keepParent cmd/tock-desktop/build/bin/Tokify.app "dist/$ASSET"
          cd dist
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  build-android:
    name: Build Tokify APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # app.config.ts bakes these into the bundle at prebuild and again when
      # Gradle exports the JS, so both steps need them.
      NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
      NEON_DATA_URL: ${{ secrets.NEON_DATA_URL }}
      NEON_NOTIFY_URL: ${{ secrets.NEON_NOTIFY_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Write upload key and Firebase config
        # After `npm ci`, so no install script ever sees them. A missing
        # secret would otherwise quietly ship a debug-signed or push-less APK.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for name in NEON_AUTH_URL NEON_DATA_URL NEON_NOTIFY_URL ANDROID_KEYSTORE_BASE64 GOOGLE_SERVICES_JSON_CONTENT; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for ${name} is not set"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
          echo "ORG_GRADLE_PROJECT_tokifyUploadStoreFile=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Stamp version from tag
        # versionName is the tag without the "v"; versionCode packs
        # major.minor.patch so every later release installs over the last.
        # A prerelease shares its final release's code.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "TOKIFY_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TOKIFY_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_tokifyUploadStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_tokifyUploadKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_tokifyUploadKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the APK is signed with the upload key
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app-release.apk | tee certs.txt
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::app-release.apk is signed with the debug key"
            exit 1
          fi

      - name: Name APK
        run: |
          mkdir -p dist
          ASSET="Tokify-${GITHUB_REF_NAME}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$ASSET"
          cd dist
          sha256sum "$ASSET" > "${ASSET}.sha256"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: mobile/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Tokify ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Tokify-${{ github.ref_name }}-macos-universal.zip
            dist/Tokify-${{ github.ref_name }}-macos-universal.zip.sha256
            dist/Tokify-${{ github.ref_name }}-android.apk
            dist/Tokify-${{ github.ref_name }}-android.apk.sha256
            dist/THIRD_PARTY_NOTICES.txt
          fail_on_unmatched_files: true
          body: |
            ## Install

            ### One-liner

            ```sh
            curl -fsSL https://raw.githubusercontent.com/relegate-to/tokify/main/install.sh | sh
            ```

            ### Manual

            1. Download `Tokify-${{ github.ref_name }}-macos-universal.zip` below.
            2. Unzip and drag `Tokify.app` into `/Applications`.
            3. First launch: right-click → **Open** → **Open**, or
               `xattr -dr com.apple.quarantine /Applications/Tokify.app`.

            Tokify releases are not yet signed with an Apple Developer ID;
            see the [README](https://github.com/relegate-to/tokify#install) for
            details.

            ### Android

            Download `Tokify-${{ github.ref_name }}-android.apk` below and open
            it on your phone; Android will ask you to allow installs from your
            browser or file manager the first time.
